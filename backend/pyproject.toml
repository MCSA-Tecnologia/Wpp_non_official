[project]
name = "autowpp-control-plane"
version = "3.0.0"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "cryptography==45.0.7",
  "fastapi==0.115.4",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "pandas==2.3.2",
  "Pillow==11.3.0",
  "prometheus-client==0.22.1",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "PyJWT==2.10.1",
  "python-multipart==0.0.20",
  "redis==6.4.0",
  "SQLAlchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
sqlserver = ["pyodbc==5.2.0"]
test = ["pytest==8.4.2", "pytest-cov==6.2.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

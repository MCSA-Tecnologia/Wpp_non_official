name: autowpp

x-api-env: &api-env
  AUTOWPP_DATABASE_URL: postgresql+psycopg://autowpp:autowpp@postgres:5432/autowpp
  AUTOWPP_REDIS_URL: redis://redis:6379/0
  AUTOWPP_JWT_SECRET: ${AUTOWPP_JWT_SECRET:-replace-this-jwt-secret}
  AUTOWPP_ENCRYPTION_KEY: ${AUTOWPP_ENCRYPTION_KEY:-}
  AUTOWPP_WORKER_TOKEN: ${AUTOWPP_WORKER_TOKEN:-replace-this-worker-token}
  AUTOWPP_BOOTSTRAP_ADMIN_EMAIL: ${AUTOWPP_BOOTSTRAP_ADMIN_EMAIL:-admin@local}
  AUTOWPP_BOOTSTRAP_ADMIN_PASSWORD: ${AUTOWPP_BOOTSTRAP_ADMIN_PASSWORD:-change-me-now}
  AUTOWPP_COOKIE_SECURE: ${AUTOWPP_COOKIE_SECURE:-false}
  AUTOWPP_CORS_ORIGINS: ${AUTOWPP_CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
  AUTOWPP_SOURCE_SQL_SERVER: ${AUTOWPP_SOURCE_SQL_SERVER:-}
  AUTOWPP_SOURCE_SQL_DATABASE: ${AUTOWPP_SOURCE_SQL_DATABASE:-}
  AUTOWPP_SOURCE_SQL_USERNAME: ${AUTOWPP_SOURCE_SQL_USERNAME:-}
  AUTOWPP_SOURCE_SQL_PASSWORD: ${AUTOWPP_SOURCE_SQL_PASSWORD:-}
  AUTOWPP_OPENAI_API_KEY: ${AUTOWPP_OPENAI_API_KEY:-}
  AUTOWPP_RO_ENABLED: ${AUTOWPP_RO_ENABLED:-false}
  AUTOWPP_RO_ENDPOINT: ${AUTOWPP_RO_ENDPOINT:-}

x-worker-env: &worker-env
  AUTOWPP_API_URL: http://api:8000/api/v1
  AUTOWPP_WORKER_TOKEN: ${AUTOWPP_WORKER_TOKEN:-replace-this-worker-token}
  AUTOWPP_WORKER_CAPACITY: 15

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: autowpp
      POSTGRES_USER: autowpp
      POSTGRES_PASSWORD: autowpp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autowpp -d autowpp"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ./backend
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker-node-1:
    build: ./worker
    environment:
      <<: *worker-env
      AUTOWPP_WORKER_ID: worker-node-1
      AUTOWPP_NODE_ID: node-1
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker-node-2:
    build: ./worker
    environment:
      <<: *worker-env
      AUTOWPP_WORKER_ID: worker-node-2
      AUTOWPP_NODE_ID: node-2
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
